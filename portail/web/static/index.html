<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>workspace</title>
  <!-- The shell's minimal page: what a server without a page of its own shows. Every address is relative. -->
  <link rel="stylesheet" href="portail/shell.css">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #1e1e1e; color: #d4d4d4; }
    #top { display: flex; gap: 0.6em; align-items: center; padding: 0.5em 1em; border-bottom: 1px solid #3c3c3c; }
    #top h1 { font-size: 1.1em; margin: 0; flex: 1; }
    #workspace { padding: 1em; }
    #workspace pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header id="top"><h1 id="title"></h1></header>
  <main id="workspace"><pre id="info"></pre></main>
  <script src="portail/shell.js"></script>
  <script>
    Portail.start({ buttons: "#top" }).then((meta) => {
      document.title = `${meta.app} — ${meta.title}`;
      document.getElementById("title").textContent = `${meta.app} — ${meta.title}`;
      document.getElementById("info").textContent = JSON.stringify(meta.workspace, null, 2);
    });
  </script>
</body>
</html>
